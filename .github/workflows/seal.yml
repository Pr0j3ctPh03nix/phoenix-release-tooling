name: seal

# THE SIGNING AUTHORITY. A producer asks; this repo signs; the results come back on a public
# branch. `PHOENIX_SIGNING_KEY` exists in exactly one place — here — and no producer repo holds it,
# no producer repo holds a token for another repo, and nothing that a producer builds ever runs in
# the job that reads the key.
#
# THE REQUEST
# (POST /repos/Pr0j3ctPh03nix/phoenix-release-tooling/actions/workflows/seal.yml/dispatches):
#
#     {"ref": "main",
#      "inputs": {"repo": "<owner>/<name>", "tag": "<the release tag>",
#                 "manifest": "<base64(gzip(the exact document bytes))>",
#                 "trusted_comment": "phoenix mod v1.2.3"}}
#
# The document is a SEAL REQUEST: it carries `serial: 0`, which names no release (nothing anywhere
# accepts a release at 0), and this job assigns the real number. A producer therefore knows nothing
# about serials — it does not read the ledger, does not count, and cannot propose a number that is
# already spent. `manifest` is that field's name whatever KIND of document it carries — a payload
# manifest or the mirror list — for the same reason phoenix_tooling/seal.py's flag is called
# `--manifest`: what gets signed is a FILE's exact bytes, and the signer reads nothing inside them.
#
# THE ANSWER, on branch `sealed`, which anybody may read:
#
#     sealed/<owner>/<name>/<tag>/<document>          the document AS SEALED, serial assigned
#     sealed/<owner>/<name>/<tag>/<document>.minisig  the signature over those exact bytes
#     sealed/<owner>/<name>/<tag>/ping.json           the signed mirror ping for that serial
#
# The document itself is part of the answer because this job is what wrote the serial into it: the
# producer publishes what comes back, not what it sent. It proves the three belong to it by
# re-rendering its own request at the ping's serial and requiring the bytes to match — see
# phoenix_tooling/dispatch.py, which is both halves of the producer's side.
#
# <document> is the file that was sealed — `manifest.json` for a payload manifest, `mirrors.json`
# for the mirror list (phoenix_tooling/ping.py's `document_name` owns that rule, because both
# sides need it) — so a signature in the ledger is never separable from what it covers. The ping is
# minted for every kind, including one no mirror will ever be told about; see the sealing step for
# why the entries are uniform.
#
# What a producer must do around this is docs/sealing.md. Read that before changing anything below.
#
# EVERY GATE RUNS BEFORE THE KEY IS READ, and the order is the whole design:
#   0. THE REF               — this file signs only on `main`, checked first and before anything
#      else is read (see that step: a dispatcher chooses the ref, a `repository_dispatch` could
#      not);
#   1. decode and authorize   — a repo may only seal the payload line it is listed for, below;
#   2. VALIDATE the document  — a manifest is rebuilt by phoenix_tooling/build_manifest.py and
#      the result must equal what was sent; a mirror list is held to its own narrow rules (see
#      `read_mirrors`). Both must carry serial 0: a request that names a release is a producer
#      trying to choose one, which is the thing that moved here.
#      Without this the job is an oracle that signs arbitrary bytes with the one key that also seals
#      the launcher, the base game and the mirror list, and a signature over attacker-chosen bytes
#      is not a smaller problem than a leaked key;
#   3. ASSIGN THE SERIAL     — one above everything branch `sealed` records for that payload. "A
#      serial only ever rises" is now a property of how the number is produced rather than a rule a
#      request is measured against: there is no number in the request to be wrong. Re-dispatching an
#      identical request is a no-op that spends nothing (see that step's idempotency rule).
# Only then is `cryptography` installed and the secret read.
#
# WHY `workflow_dispatch` AND NOT `repository_dispatch`. The two differ in one thing that matters
# here: the token a producer needs to send the request. `POST /repos/{owner}/{repo}/dispatches`
# requires "Contents" repository permissions (write) — a token that can also PUSH to this repository,
# including to the branch this workflow is read from. The workflow-dispatch endpoint requires
# "Actions" repository permissions (write) instead
# (https://docs.github.com/en/rest/actions/workflows#create-a-workflow-dispatch-event), which cannot
# write a single byte of a repository's contents. The transport credential is now unable to rewrite
# what signs, rather than merely forbidden to by a ruleset.
#
# What that trade costs is the ref: a `repository_dispatch` always ran the DEFAULT branch's copy of
# this file, while a dispatcher NAMES the ref it wants and GitHub runs that ref's copy. Step 0 is
# what buys the property back.
#
# NEVER interpolate `${{ }}` into a `run:` block. It is textual substitution performed before bash
# parses the script, and every field below arrives from an outside repository — a tag name is
# executable code. Everything from the event goes through `env:` and is read back as "$VAR", and
# the step that reads it checks each field's character set before anything else sees it.
on:
  workflow_dispatch:
    # Exactly four, all required, all strings — the same fields, with the same meanings, that used
    # to arrive as a `client_payload`. The set is closed again in Python below: `required` here says
    # only that each one is present.
    inputs:
      repo:
        description: "The repository asking, <owner>/<name>. It may seal one payload line and no other."
        required: true
        type: string
      tag:
        description: "The release tag this seal is filed under, [A-Za-z0-9][A-Za-z0-9._-]{0,63}"
        required: true
        type: string
      manifest:
        description: "base64(gzip(the exact bytes of the document to seal))"
        required: true
        type: string
      trusted_comment:
        description: "Signed and therefore quotable, e.g. 'phoenix mod v1.2.3'"
        required: true
        type: string

permissions:
  contents: write        # push the sealed document, its signature and the ping to branch `sealed`

# ONE SEAL AT A TIME, and queued rather than cancelled. This job reads the ledger's high-water mark
# and then adds to it — the read-then-add race that used to be split between a producer and this
# job is now entirely inside it, which is exactly why this must stay: two overlapping runs would
# both read the same mark and assign the same serial to two different documents. A cancelled run is
# one that may already have signed, which is not a run any later one supersedes — it is a producer
# waiting for a file that will never appear. Two payloads sealing at once therefore serialise here,
# which costs a minute and removes the whole class.
concurrency:
  group: seal
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    env:
      # The whole request as JSON. Read as DATA by the step below, which is what makes a tag name
      # or a comment field text rather than script. Individual fields are deliberately NOT pulled
      # out into separate env vars here: the checks that follow have to see the request as a whole
      # (an extra property, a missing one, a wrong type) and an empty string cannot say which of
      # those happened.
      REQUEST: ${{ toJSON(github.event.inputs) }}
      LEDGER_BRANCH: sealed
      # The one ref this file will sign on. `github.ref` arrives in the environment as GITHUB_REF
      # already, so the comparison needs no interpolation at all.
      SEAL_REF: refs/heads/main
    steps:
      # THE REF GATE, first: before the checkout, before the ledger, before a byte of the request is
      # looked at. A dispatcher names the ref and GitHub runs THAT ref's copy of this file, so
      # without this line an old branch is an old, weaker set of these rules holding the same key.
      #
      # A gate can only speak for the revisions that carry it — a branch pointing at a commit from
      # before this step has no gate to run — so it is not the whole of that boundary. The rest is
      # the token: the dispatch PAT holds Actions: write and nothing else, so it cannot create a ref
      # or move one, and only somebody with push access could leave a stale branch here to aim at.
      # This makes such a branch a refusal rather than a signature under superseded rules.
      - name: Refuse to sign on any ref but main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$SEAL_REF" || {
            echo "REFUSED: this workflow signs only on $SEAL_REF, and this run is on $GITHUB_REF."
            echo "A dispatch names the ref it runs, and an older branch may carry older rules for"
            echo "the same key. Dispatch with {\"ref\": \"main\"}."
            exit 1
          }
          echo "ref: $GITHUB_REF"

      # Everything this run writes: the decoded document, the signature, the ping, and the ledger
      # clone. Outside the workspace, because none of it is a file this repository authored — and
      # named in a step rather than in `env:` above, where the `runner` context does not exist.
      - name: Where this run's files go
        run: |
          echo "WORK=$RUNNER_TEMP/seal" >> "$GITHUB_ENV"
          echo "LEDGER=$RUNNER_TEMP/ledger" >> "$GITHUB_ENV"

      # Third-party actions are pinned to COMMIT SHAs, not tags: a tag is mutable, and every action
      # in this job runs beside PHOENIX_SIGNING_KEY. The trailing comment is the human-readable
      # version; update both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # The ledger, as it stands before this request. Cloned rather than checked out into the
      # workspace: it is a branch with an unrelated history (an orphan), and it must not be
      # mistakable for the tree this repo's tools are read from.
      #
      # A MISSING BRANCH IS A LEGITIMATE STATE — exactly once, before the first payload is ever
      # sealed — and it is told apart from "the ledger could not be read" by ls-remote's exit code,
      # not by guessing from a failed clone. The difference matters: an unreadable ledger read as
      # empty is one this job would assign serial 1 from, re-issuing a number that is long spent.
      - name: Fetch the ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY"
          set +e
          git ls-remote --exit-code --heads "$url" "$LEDGER_BRANCH" >/dev/null 2>&1
          rc=$?
          set -e
          case "$rc" in
            0) # Not shallow: this history is one small commit per release, and a shallow clone is
               # a clone the retry below cannot rebase cleanly.
               git clone --quiet --branch "$LEDGER_BRANCH" --single-branch "$url" "$LEDGER"
               echo "ledger: $LEDGER_BRANCH at $(git -C "$LEDGER" rev-parse --short HEAD)" ;;
            2) echo "ledger: no '$LEDGER_BRANCH' branch yet — nothing has ever been sealed here"
               mkdir -p "$LEDGER"
               git -C "$LEDGER" init --quiet --initial-branch "$LEDGER_BRANCH"
               git -C "$LEDGER" remote add origin "$url" ;;
            *) echo "cannot tell whether '$LEDGER_BRANCH' exists (git ls-remote exited $rc) —"
               echo "refusing to treat an unreadable ledger as an empty one."
               exit 1 ;;
          esac

      # THE AUTHORIZATION MAP lives here, in the workflow, because it is a fact about who may ask
      # for what — not about the manifest format, which knows only that `payload_id` is one of a
      # closed set, and not about the mirror list's format either, which lives in the registry. The
      # dispatch PAT is the only credential in the request and it says nothing but "some holder of
      # this token": authorization is therefore by SHAPE — the requesting repo may seal one payload
      # line and no other, so a stolen launcher token cannot mint a mod release, and a stolen
      # registry token cannot mint anything a launcher installs.
      #
      # The base game is absent on purpose: it is published by hand, by someone holding the key
      # offline (see docs/release-keys.md in client-dist-staging), and giving that line a CI path
      # would mean a second way to publish it.
      - name: Read the request
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          python - <<'PY'
          import base64, gzip, io, json, os, re, sys
          from phoenix_tooling import build_manifest, ping

          ALLOWED = {
              "Pr0j3ctPh03nix/client-dist-staging":     "mod",
              "Pr0j3ctPh03nix/client-dist":             "mod",
              "Pr0j3ctPh03nix/phoenix-launcher":        "launcher",
              "Pr0j3ctPh03nix/phoenix-mirror-registry": "mirrors",
          }
          # The mirror list is its own DOCUMENT KIND, not a fourth manifest: it has no files and no
          # bundles, its format is the registry's generate_mirror_list.py, and `mirrors` is
          # deliberately not in manifest_schema.PAYLOAD_IDS. The two kinds are therefore sealed into
          # differently NAMED documents and signatures (ping.document_name, which the producer's
          # side reads too), so nothing downstream can offer one where the other is expected.
          MIRRORS = ping.MIRRORS

          FIELDS = ("repo", "tag", "manifest", "trusted_comment")
          # GitHub caps a whole workflow_dispatch `inputs` object at 65,535 characters, so nothing
          # larger can have arrived; the limit is restated as a refusal rather than assumed, and the
          # decompressed ceiling is what keeps a small gzip from expanding into an enormous one.
          MAX_ENCODED = 65_535
          MAX_DOCUMENT = 1024 * 1024
          # A tag is a directory name in the ledger and an env var this job writes, so it is held to
          # a set with no separator, no traversal and no newline in it.
          TAG_RE = re.compile(r"\A[A-Za-z0-9][A-Za-z0-9._-]{0,63}\Z")

          def refuse(why):
              sys.exit("REFUSED: " + why)

          def read_mirrors(doc):
              """Check a mirror list, or refuse it. DELIBERATELY only these checks.

              There is no builder here to rebuild a mirror list with, and writing one would be
              exactly the drifting second implementation of a format that build_manifest.validate
              exists to avoid — the format is the registry's own generate_mirror_list.py. It is also
              not needed: every rule about the LIST — the URLs, the names, the countries, the
              payload sets, the duplicates — is enforced by that repo's validate.yml on the pull
              request that adds a mirror, before anything can be merged or published.

              What this authority owes is narrower, and is entirely about what its signature would
              MEAN: the bytes are one unambiguous document (build_manifest.parse, below); the
              document says `mirrors`, so no reader can ever take a signed mirror list for a payload
              manifest; its serial is a whole number, which the shared check below then requires to
              be the 0 of a request; and there is a `mirrors` array, because a document without one
              is not the thing being asked for."""
              if doc.get("payload_id") != MIRRORS:
                  refuse(f"a mirror list carries payload_id {MIRRORS!r}, and this document carries "
                         f"{doc.get('payload_id')!r}")
              serial = doc.get("serial")
              if isinstance(serial, bool) or not isinstance(serial, int):
                  refuse(f"the mirror list's serial is {serial!r}, and a serial is a whole number")
              if not isinstance(doc.get("mirrors"), list):
                  refuse(f"a mirror list carries a `mirrors` array; this document carries "
                         f"{type(doc.get('mirrors')).__name__}")
              return serial

          try:
              req = json.loads(os.environ["REQUEST"])
          except ValueError as e:
              refuse(f"the dispatch inputs are not JSON ({e})")
          if not isinstance(req, dict) or tuple(sorted(req)) != tuple(sorted(FIELDS)):
              refuse(f"the request carries {tuple(sorted(req))}, expected exactly "
                     f"{tuple(sorted(FIELDS))}")
          if not all(isinstance(req[k], str) and req[k] for k in FIELDS):
              refuse("every field of the request is a non-empty string")

          repo, tag, comment = req["repo"], req["tag"], req["trusted_comment"]
          if repo not in ALLOWED:
              refuse(f"{repo!r} may not ask this repository to sign anything")
          if not TAG_RE.match(tag):
              refuse(f"tag {tag!r} is not [A-Za-z0-9][A-Za-z0-9._-]{{0,63}}")
          if len(comment) > 200 or not all(" " <= c <= "~" for c in comment):
              refuse("the trusted comment must be one line of printable ASCII, 200 chars or fewer")

          if len(req["manifest"]) > MAX_ENCODED:
              refuse(f"the encoded document is {len(req['manifest'])} chars; GitHub caps a whole "
                     f"workflow_dispatch `inputs` at {MAX_ENCODED}, which the other three fields "
                     f"share")
          try:
              blob = base64.b64decode(req["manifest"], validate=True)
              with gzip.GzipFile(fileobj=io.BytesIO(blob)) as gz:
                  raw = gz.read(MAX_DOCUMENT + 1)
          except Exception as e:                       # noqa: BLE001 — malformed is malformed
              refuse(f"the manifest field is not base64(gzip(bytes)): {type(e).__name__}: {e}")
          if len(raw) > MAX_DOCUMENT:
              refuse(f"the document decompresses to more than {MAX_DOCUMENT} bytes")

          payload = ALLOWED[repo]
          # Read once, strictly, for BOTH kinds: no duplicate keys (a document whose meaning depends
          # on which parser reads it is one nobody should sign), UTF-8, an object at the root.
          try:
              doc = build_manifest.parse(raw)
          except Exception as e:                       # noqa: BLE001
              refuse(f"these bytes are not a document this repo will read: {type(e).__name__}: {e}")

          if payload == MIRRORS:
              serial = read_mirrors(doc)
              what = f"a mirror list, {len(doc['mirrors'])} mirror(s)"
          else:
              # The one check that makes this a signing AUTHORITY rather than a signing oracle: the
              # document is rebuilt by the repo's own builder and must equal what was sent. Any
              # exception at all is a refusal — a document nobody here can read is not one to sign.
              try:
                  doc = build_manifest.validate(doc)
              except Exception as e:                   # noqa: BLE001
                  refuse(f"this is not a manifest this repo would build: {type(e).__name__}: {e}")
              if doc["payload_id"] != payload:
                  refuse(f"{repo} may seal payload_id {payload!r}, and this manifest is "
                         f"{doc['payload_id']!r}")
              serial = doc["serial"]
              what = f"a valid {payload} manifest, {len(doc['files'])} file(s)"

          # A REQUEST NAMES NO RELEASE. The serial is this job's to write (the next step), so the
          # only value a request may carry is the one that means "none" — and it has to be checked
          # rather than overwritten, because a document carrying a real number is a producer that
          # still believes it chooses, and quietly renumbering it would publish something other than
          # what that producer thinks it built.
          if serial != 0:
              refuse(f"this document carries serial {serial}, and a seal request carries 0 — the "
                     f"authority assigns serials from its ledger. See docs/sealing.md.")

          # The request's bytes, under a name that is NOT the document's: what gets sealed is what
          # the next step writes there, at the serial it assigns.
          with open(os.path.join(os.environ["WORK"], "request.json"), "wb") as fh:
              fh.write(raw)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              for k, v in (("REQ_REPO", repo), ("REQ_TAG", tag), ("TRUSTED_COMMENT", comment),
                           ("PAYLOAD_ID", payload), ("DOC", ping.document_name(payload)),
                           ("REQUEST_FILE", os.path.join(os.environ["WORK"], "request.json"))):
                  fh.write(f"{k}={v}\n")
          print(f"{repo} {tag}: {what}, a seal request of {len(raw)} bytes")
          PY

      # ASSIGN THE SERIAL, and the reason this repo is where it belongs: a serial is per-payload and
      # only ever rises, and while each producer counted up from its own latest published release
      # nothing could enforce that — a published release cannot see a serial that was sealed and
      # then never shipped. The number is now produced HERE, one above the ledger's own high-water
      # mark, so "only ever rises" is not a rule a request can fail: there is no number in a request.
      #
      # The document is rendered at that serial and written to $WORK. THOSE bytes are what gets
      # signed and what the producer publishes — build_manifest.assign is the one function that
      # writes a serial into a document, and the producer re-runs it over its own request to prove
      # what came back is its own (phoenix_tooling/dispatch.py).
      #
      # IDEMPOTENCY, which replaces the old ratchet refusal: a re-dispatch of a request that was
      # already sealed under this tag is a no-op. The entry's own document is compared against this
      # request rendered at the entry's serial, so "already sealed" means the ledger holds the exact
      # bytes this request would produce — not merely that something was sealed here once. A
      # producer whose job died after the seal re-runs and gets its files; nothing is signed again
      # and no serial is spent. Anything else — a changed document, or an entry from before the
      # document was part of an answer — is a fresh seal at high + 1, overwriting the tag's
      # directory, which is what a rebuilt tag has always done here.
      - name: Assign the serial
        id: assign
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from phoenix_tooling import build_manifest, ping

          work, ledger, payload = os.environ["WORK"], os.environ["LEDGER"], os.environ["PAYLOAD_ID"]
          name = os.environ["DOC"]
          entry = os.path.join(ledger, ping.LEDGER_DIR, *os.environ["REQ_REPO"].split("/"),
                               os.environ["REQ_TAG"])
          with open(os.environ["REQUEST_FILE"], "rb") as fh:
              request = build_manifest.parse(fh.read())

          def sealed(serial):
              """The document's exact bytes as sealed at `serial`. A mirror list has no builder to
              assign through — that is the whole reason its kind exists (see the step above) — so
              its serial is set on the document as parsed; everything else goes through
              build_manifest.assign, which validates what it produces. Both render the same way,
              which is the property the producer's comparison rests on."""
              if payload == ping.MIRRORS:
                  return build_manifest.render(dict(request, serial=int(ping.check_serial(serial))))
              return build_manifest.render(build_manifest.assign(request, serial))

          high = ping.ledger_high(ledger, payload)

          already = None
          document = os.path.join(entry, name)
          if os.path.isfile(document) and os.path.isfile(os.path.join(entry, ping.PING_NAME)):
              was, _ = ping.read_file(os.path.join(entry, ping.PING_NAME))
              with open(document, "rb") as fh:
                  have = fh.read()
              if was["payload"] == payload and have == sealed(was["serial"]):
                  already = int(was["serial"])

          if already is None:
              serial = high + 1
              with open(os.path.join(work, name), "wb") as fh:
                  fh.write(sealed(serial))
              print(f"{payload}: highest sealed serial {high} -> this request seals {serial}")
          else:
              serial = already
              print(f"{payload}: this exact document is already sealed at serial {serial} under "
                    f"{os.environ['REQ_TAG']} — nothing to sign, nothing to push")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"SERIAL={serial}\n")
          if already is not None:
              # A step OUTPUT rather than an env var, because the two steps below skip on it and an
              # `if:` reads outputs by the id of the step that decided — the decision and the skip
              # are then one thing to follow rather than two.
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("already_sealed=1\n")
          PY

      # FROM THE PINNED CHECKOUT, NOT FROM AN INDEX — the same rule, and the same wheels, every
      # producer's workflow uses (see wheels/README.md). This job holds PHOENIX_SIGNING_KEY and
      # `cryptography` is the code the key is handed to, so it arrives from this repository's own
      # tree rather than from whatever an index answers with at signing time. Installed only after
      # every gate above has passed: a refused request never installs anything.
      - name: Install the signing dependency
        run: python -m pip install --disable-pip-version-check --no-index --find-links wheels cryptography

      # Sign the document's exact bytes and prove the signature against the public half clients
      # pin (phoenix_tooling/seal.py — the ORDER of those two is the whole point), then sign the
      # mirror ping for the same serial and prove that too. Both are the same key and both fail
      # the same way if it is ever rotated without republishing keys/: perfectly valid signatures
      # nobody accepts, whose only symptom is an update channel that has quietly stopped existing.
      #
      # A PING IS MINTED FOR EVERY KIND, including `mirrors`, which no mirror will ever be told
      # about — a mirror's registry entry lists the payload trees it serves (mod/launcher/game) and
      # never the list itself, so phoenix_tooling/notify.py finds no carrier and the registry does
      # not even call it. It is minted anyway because it makes every ledger entry the same three
      # files, and `ping.json` is where phoenix_tooling/ping.py's ledger reads a serial from: a
      # kind that skipped it would be a kind the counter cannot see. `[a-z]+` is the whole of what
      # a ping's payload has to satisfy, and `mirrors` satisfies it.
      - name: Seal the document and sign its ping
        if: steps.assign.outputs.already_sealed != '1'
        env:
          PHOENIX_SIGNING_KEY: ${{ secrets.PHOENIX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$PHOENIX_SIGNING_KEY" || {
            echo "secrets.PHOENIX_SIGNING_KEY is not set in the one repository that holds it."
            echo "Every producer is now waiting on a signature nobody can make."
            exit 1
          }
          python phx.py seal seal \
            --manifest "$WORK/$DOC" \
            --pub      keys/phoenix-active.pub \
            --trusted-comment "$TRUSTED_COMMENT"
          python phx.py ping sign \
            --payload "$PAYLOAD_ID" --serial "$SERIAL" --out "$WORK/ping.json"
          python phx.py ping verify "$WORK/ping.json" --pub keys/phoenix-active.pub
          ls -l "$WORK"

      # THE ANSWER, and the ledger entry, in ONE commit: the three files are written together
      # because phoenix_tooling/ping.py refuses a tag directory carrying only some of them — a
      # half-written entry would make every later ledger read fail rather than merely be incomplete
      # — and because the next request under this tag decides "already sealed" by comparing the
      # document against the ping's serial, which is only an answer if the two arrived together.
      #
      # The push is retried on a non-fast-forward. `concurrency` above should make that impossible,
      # but the cost of being wrong is a producer waiting ten minutes for a file that was signed and
      # then dropped, and the cost of the retry is four lines.
      - name: Publish to the ledger
        if: steps.assign.outputs.already_sealed != '1'
        run: |
          set -euo pipefail
          entry="$LEDGER/sealed/$REQ_REPO/$REQ_TAG"
          mkdir -p "$entry"
          cp "$WORK/$DOC" "$WORK/$DOC.minisig" "$WORK/ping.json" "$entry/"
          cd "$LEDGER"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "sealed/$REQ_REPO/$REQ_TAG"
          if git diff --cached --quiet; then
            echo "the ledger already carries exactly these bytes — nothing to push"
            exit 0
          fi
          git commit --quiet -m "seal: $REQ_REPO $REQ_TAG — $PAYLOAD_ID serial $SERIAL"
          for attempt in 1 2 3; do
            if git push --quiet origin "HEAD:$LEDGER_BRANCH"; then
              echo "sealed/$REQ_REPO/$REQ_TAG is published on $LEDGER_BRANCH"
              exit 0
            fi
            echo "push $attempt was rejected; rebasing onto $LEDGER_BRANCH and trying again"
            git fetch --quiet origin "$LEDGER_BRANCH"
            git rebase FETCH_HEAD
            sleep 5
          done
          echo "could not publish the seal to $LEDGER_BRANCH. It WAS signed: re-run this job, or"
          echo "the producer must dispatch again with a higher serial."
          exit 1

      - name: Summary
        env:
          ALREADY_SEALED: ${{ steps.assign.outputs.already_sealed }}
        run: |
          {
            if [ "${ALREADY_SEALED:-}" = "1" ]; then
              echo "### Already sealed: \`$PAYLOAD_ID\` serial \`$SERIAL\`"
              echo
              echo "The ledger already carries exactly this document under \`$REQ_TAG\`. Nothing"
              echo "was signed and no serial was spent; the answer below is the one it already has."
            else
              echo "### Sealed \`$PAYLOAD_ID\` serial \`$SERIAL\`"
            fi
            echo
            echo "Requested by \`$REQ_REPO\` for tag \`$REQ_TAG\`."
            echo
            echo "    git fetch https://github.com/$GITHUB_REPOSITORY $LEDGER_BRANCH"
            echo "    git show FETCH_HEAD:sealed/$REQ_REPO/$REQ_TAG/$DOC"
            echo "    git show FETCH_HEAD:sealed/$REQ_REPO/$REQ_TAG/$DOC.minisig"
          } >> "$GITHUB_STEP_SUMMARY"
